# "לא יודע מאיפה להתחיל?". כל ענף: קושי עיקרי. תוצאות = base + התוספות לפי התשובות.
# הניסוח בלשון רבים וניטרלית. כל שאלה צריכה לשנות את התוצאה, אחרת אין טעם בה.
# add ו-base הם שמות קבצים בתיקיית src/content/rights (בלי .md).

- id: money
  label: קושי כלכלי
  order: 1
  base: [financial-aid]
  questions:
    - q: האם אתם רוצים לעבוד כדי לסייע לעצמכם?
      options:
        - { label: כן, add: [private-work-permit, special-leave] }
        - { label: לא, add: [] }
    - q: האם גם המשפחה שלכם במצוקה כלכלית?
      options:
        - { label: כן, add: [family-payments, early-release-personal] }
        - { label: לא, add: [] }
    - q: האם תרצו ליווי בהתנהלות כלכלית?
      options:
        - { label: כן, add: [financial-education] }
        - { label: לא, add: [] }
- id: home
  label: קושי בבית או במשפחה
  order: 2
  base: [service-relief]
  questions:
    - q: האם אתם גרים בבית ההורים?
      options:
        - { label: כן, add: [] }
        - { label: לא, add: [assistance-eligible, lone-soldier] }
    - q: יש בבית בעיה רפואית, כלכלית או סוציאלית קשה?
      options:
        - { label: כן, add: [early-release-personal, family-payments] }
        - { label: לא, add: [] }
    - q: אתם באוכלוסייה שזכאית להקלה מובנית (למשל יתומים, הורים לילד, בן יחיד)?
      options:
        - { label: כן או לא בטוח, add: [built-in-relief, or-population] }
        - { label: לא, add: [] }
- id: living
  label: קשה לי לגור בבית
  order: 3
  base: [housing]
  questions:
    - q: מה הסיבה?
      options:
        - { label: נתק או קשר מורכב עם ההורים, add: [lone-soldier, assistance-eligible, military-housing] }
        - { label: מרחק או צפיפות, add: [military-housing] }
        - { label: אני שוכר דירה, add: [rent] }
- id: work
  label: אני צריך לעבוד
  order: 4
  base: [private-work-permit]
  questions:
    - q: האם אתם במצוקה כלכלית?
      options:
        - { label: כן, add: [special-leave, financial-aid] }
        - { label: לא, add: [] }
- id: leave
  label: אני צריך חופשה או יום סידורים
  order: 5
  base: [special-leave]
  questions:
    - q: מה הצורך?
      options:
        - { label: כלכלי, add: [private-work-permit, financial-aid] }
        - { label: חתונה או לידה, add: [married-soldier] }
        - { label: סידורים אישיים, add: [errands-day] }
        - { label: ביקור הורים בחו״ל, add: [lone-soldier, lone-flights] }
- id: lone
  label: אני חייל בודד או זכאי סיוע
  order: 6
  base: [lone-soldier, assistance-eligible]
  questions:
    - q: מה מעניין אתכם?
      options:
        - { label: מגורים, add: [military-housing, rent, housing] }
        - { label: טיסה להורים, add: [lone-flights] }
        - { label: לקראת שחרור, add: [lone-release] }
- id: family
  label: אני נשוי או הורה לילדים
  order: 7
  base: [married-soldier]
  questions:
    - q: מה תרצו לבדוק?
      options:
        - { label: תשלומי משפחה, add: [family-payments] }
        - { label: שכר דירה, add: [rent] }
        - { label: הקלות בתנאי שירות, add: [built-in-relief] }
- id: release
