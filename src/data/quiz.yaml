# "לא יודע מאיפה להתחיל?". כל ענף: קושי עיקרי. תוצאות = base + התוספות לפי התשובות.
# הניסוח בלשון רבים וניטרלית. כל שאלה צריכה לשנות את התוצאה, אחרת אין טעם בה.
# add ו-base הם שמות קבצים בתיקיית src/content/rights (בלי .md).

- id: money
  label: קושי כלכלי
  order: 1
  base: [financial-aid]
  questions:
    - q: האם אתם רוצים לעבוד כדי לסייע לעצמכם?
      options:
        - { label: כן, add: [private-work-permit, special-leave] }
        - { label: לא, add: [] }
    - q: האם גם המשפחה שלכם במצוקה כלכלית?
      options:
        - { label: כן, add: [family-payments] }
        - { label: לא, add: [] }
    - q: איזה סוג סיוע אתם צריכים?
      options:
        - { label: חד-פעמי, add: [] }
        - { label: לאורך זמן, add: [assistance-eligible] }
- id: home
  label: קושי בבית או במשפחה
  order: 2
  base: [service-relief]
  questions:
    - q: האם אתם גרים בבית ההורים?
      options:
        - { label: כן, add: [] }
        - { label: לא, add: [assistance-eligible, housing] }
    - q: האם יש בעיה רפואית או סוציאלית במשפחה?
      options:
        - { label: כן, add: [early-release-personal] }
        - { label: לא, add: [] }
- id: living
  label: אני לא יכול לגור בבית
  order: 3
  base: [housing, assistance-eligible]
  questions:
    - q: מה הסיבה שאי אפשר לגור בבית?
      options:
        - { label: נסיבות משפחתיות, add: [lone-soldier] }
        - { label: מרחק, add: [travel-refunds] }
        - { label: צפיפות, add: [] }
- id: work
  label: אני צריך לעבוד
  order: 4
  base: [private-work-permit]
  questions:
    - q: האם אתם במצוקה כלכלית?
      options:
        - { label: כן, add: [special-leave, financial-aid] }
        - { label: לא, add: [] }
- id: leave
  label: אני צריך חופשה
  order: 5
  base: [special-leave]
  questions:
    - q: מה הצורך?
      options:
        - { label: כלכלי, add: [private-work-permit, financial-aid] }
        - { label: לימודים, add: [] }
        - { label: משפחה, add: [married-soldier, pregnancy-parenthood] }
        - { label: מעבר דירה או אירוע אישי, add: [lone-soldier, married-soldier] }
- id: lone
  label: אני חייל בודד או חושב שאני זכאי להכרה
  order: 6
  base: [lone-soldier, assistance-eligible]
  questions: []
- id: family
  label: אני נשוי או הורה לילדים
  order: 7
  base: [married-soldier, pregnancy-parenthood]
  questions:
    - q: האם בן הזוג או ההורים זקוקים לסיוע?
      options:
        - { label: כן, add: [family-payments] }
        - { label: לא, add: [] }
- id: docs
  label: אני צריך עזרה עם מסמכים
  order: 8
  base: []
  questions: []
- id: other
  label: נושא אחר
  order: 9
  base: [special-populations]
  questions: []
