# שאלות נפוצות. כל שאלה: id (באנגלית, ייחודי), group, q, a, ו-rights (קישור לעמוד המלא, אופציונלי).
# שורת התשובה בין מרכאות. אם יש בה נקודתיים, חובה מרכאות.

- id: what-is-or
  group: "קליטה ושירות"
  order: 3
  q: "מה זה חייל ׳אור׳?"
  a: "חייל שמשתייך לאחת האוכלוסיות שצה״ל מלווה באופן צמוד יותר, כמו עולים חדשים, בודדים, נשואים, מפונים, גרושים, אבות לילד ובנים למשפחות שכולות."
- id: errands-day-who
  group: "קליטה ושירות"
  order: 4
  q: "למי מגיע יום סידורים?"
  a: "לנשואים או ידועים בציבור ביחידה סגורה, להורים לילד, לגרושים, לבודדים, לנפגעי פעולות איבה בתהליך ולמפונים. התדירות תלויה באוכלוסייה ובשלב השירות."
  rights: [errands-day]
- id: errands-day-waiver
  group: "קליטה ושירות"
  order: 5
  q: "אפשר לוותר על יום הסידורים החודש?"
  a: "כן, עד 7 ימים לפני סוף החודש, דרך ת״ש בטאצ׳."
  rights: [errands-day]
- id: home-visit-refuse
  group: "קליטה ושירות"
  order: 6
  q: "אפשר לסרב לביקור בית?"
  a: "כן. במקום זה מראיין אותך מפקד בדרגת רס״ן ומעלה, וחותמים בפניו על הצהרה עם הסיבות."
  rights: [interviews-visits]

- id: special-leave-timeline
  group: "חופשות ועבודה"
  order: 7
  q: "כמה זמן יש להביא מסמכים לחופשה מיוחדת?"
  a: "30 ימים להביא את כל האישורים. המפקד מעביר החלטה תוך 7 ימים."
  rights: [special-leave]
- id: special-leave-sick
  group: "חופשות ועבודה"
  order: 8
  q: "קיבלתי ג׳ באמצע חופשה מיוחדת. מה קורה לימים?"
  a: "את היתרה מקבלים אחרי ההחלמה, עד התאריך המקורי שאושר. לימים שמעבר לזה מגישים בקשה חדשה."
  rights: [special-leave]
- id: work-permit-before-start
  group: "חופשות ועבודה"
  order: 9
  q: "מצאתי עבודה. מתי מותר להתחיל?"
  a: "רק אחרי שנמסר לידיך היתר עבודה פרטית. את הבקשה פותחים בת״ש בטאצ׳."
  rights: [private-work-permit]
- id: work-permit-validity
  group: "חופשות ועבודה"
  order: 10
  q: "לכמה זמן ההיתר בתוקף?"
  a: "עד שנה. לחידוש מגישים בקשה חדשה. הארכה מנהלתית של עד 3 חודשים לאותה עבודה אפשרית בהמלצת מש״קית הת״ש."
  rights: [private-work-permit]

- id: what-is-hatash
  group: "הקלות וקיצור שירות"
  order: 11
  q: "מה זה הת״ש?"
  a: "הקלות בתנאי שירות. ההקלה נותנת מספר לילות בשבוע בבית, כדי לעזור לבן משפחה מדרגה ראשונה שזקוק לעזרה. היא בתוקף עד תום השירות."
  rights: [service-relief]
- id: hatash-upload-deadline
  group: "הקלות וקיצור שירות"
  order: 12
  q: "כמה זמן יש לי להביא מסמכים לבקשת הת״ש?"
  a: "30 יום מפתיחת הבקשה. מעלים את האישורים בת״ש בטאצ׳."
  rights: [service-relief]
- id: hatash-transfer-unit
  group: "הקלות וקיצור שירות"
  order: 13
  q: "אם אקבל הת״ש 3 אעבור יחידה?"
  a: "לא אוטומטית. מפקד בדרגת רס״ן מראיין אותך תוך 7 ימי עבודה ומנסה להשאיר אותך ביחידה. רק אם זה לא אפשרי מטפלים במעבר תוך 10 ימי עבודה."
  rights: [service-relief]
- id: hatash-appeal
  group: "הקלות וקיצור שירות"
  order: 14
  q: "אפשר לערער על החלטת הת״ש?"
  a: "כן, פעם אחת, תוך 3 חודשים מקבלת ההחלטה. הערעור נבחן תוך 14 ימים."
  rights: [service-relief]
- id: parent-died-relief
  group: "הקלות וקיצור שירות"
  order: 15
  q: "הורה שלי נפטר. מגיעה לי הקלה?"
  a: "כן, הת״ש 3 בלי שיקול דעת מפקד, עד 5 שנים מהפטירה או עד תום השירות, המוקדם מביניהם. מביאים תעודת פטירה."
  rights: [built-in-relief]
- id: married-child-relief
  group: "הקלות וקיצור שירות"
  order: 16
  q: "נולד לי ילד. מה מגיע לי בתנאי השירות?"
  a: "חייל נשוי או ידוע בציבור עם ילד מקבל הת״ש 3 אוטומטי, מיום הלידה או מיום הבקשה (המאוחר), עד תום השירות."
  rights: [built-in-relief]
- id: early-release-who-approves
  group: "הקלות וקיצור שירות"
  order: 17
  q: "מי מאשר קיצור שירות מטעמי פרט?"
  a: "תלוי באורך: עד חודש רת״ח פרט וגיוסים, עד 3 חודשים רמ״ד פרט מיטב, עד 6 חודשים סגן מפקד מיטב, שנה מפקד מיטב, ויותר רק ר׳ עתכ״ס."
  rights: [early-release-personal]
- id: early-release-admin-max
  group: "הקלות וקיצור שירות"
  order: 18
  q: "כמה אפשר לקצר בקיצור שירות מנהלתי?"
  a: "עד 4 חודשים. התנאים כוללים בין השאר מקצוע מנהלה, יחידה עורפית, הת״ש 5 ומעלה (או הת״ש 4 ומעלה מסיבה נפשית), ו-24 חודשי שירות לגברים או 18 לנשים. כל התנאים בעמוד הזכות."
  rights: [early-release-admin]

- id: lone-monthly-grant
  group: "בודדים וזכאי סיוע"
  order: 19
  q: "כמה מקבל חייל בודד בחודש?"
  a: "מענק חודשי קבוע של 637.11 ₪ כתוספת לשכר, ועוד 495.05 ₪ ברמ״פ א+ או 247.68 ₪ ברמ״פ א׳. בנוסף תווי קנייה של 150 ₪ בחודש."
  rights: [lone-soldier]
- id: assistance-eligible-vs-lone
  group: "בודדים וזכאי סיוע"
  order: 20
  q: "מה ההבדל בין זכאי סיוע לחייל בודד?"
  a: "זכאי סיוע לא גר אצל הוריו והקשר איתם מורכב, אבל הם עדיין תומכים בו באופן מינימלי. העורף שלו חלקי."
  rights: [assistance-eligible, lone-soldier]
- id: assistance-eligible-grant
  group: "בודדים וזכאי סיוע"
  order: 21
  q: "כמה מקבל חייל זכאי סיוע?"
  a: "מענק של 318.50 ₪, ללוחם 495.05 ₪ וברמ״פ א׳ 247.68 ₪. בנוסף תווי קנייה של 150 ₪, או 400 ₪ בדירת אל״ח."
  rights: [assistance-eligible]
- id: lone-flight-once
  group: "בודדים וזכאי סיוע"
  order: 22
  q: "כמה פעמים מממנים לי טיסה להורים?"
  a: "פעם אחת בשירות, ולוחם פעמיים, אחרי 8 חודשי שירות. את הכרטיסים מזמינה רק ״האגודה למען החייל״."
  rights: [lone-flights]
- id: lone-emergency-flight
  group: "בודדים וזכאי סיוע"
  order: 23
  q: "קרוב שלי נפטר בחו״ל. מה עושים?"
  a: "פונים מיד למוקד הבודדים: 1111, שלוחה 2 ואז 7. מגיעה טיסה במימון מלא ל-30 ימים, להלוויה ולימי האבל."
  rights: [lone-flights]
- id: parents-made-aliyah
  group: "בודדים וזכאי סיוע"
  order: 24
  q: "ההורים שלי עלו לארץ. אני עדיין בודד?"
  a: "מגישים בקשה לביטול ההטבה. הזכאות מתקצרת למועד העלייה ועוד 3 חודשי התארגנות, למי שהוכר כבודד לפחות 3 חודשים. אם זה קרה ב-6 החודשים האחרונים של השירות, היא נשמרת עד השחרור. בודקים עם מש״קית הת״ש."
  rights: [lone-soldier]
- id: lone-after-release-rent
  group: "בודדים וזכאי סיוע"
  order: 25
  q: "מה מגיע לבודד בדיור אחרי השחרור?"
  a: "עד 3 חודשים בבית החייל, וסיוע בשכר דירה של 1,000 ₪ בחודש עד 12 חודשים. החודשים בבית החייל מקוזזים מהסיוע."
  rights: [lone-release, military-housing]

- id: distance-lodging
  group: "דיור והלנה"
  order: 26
  q: "אני גר רחוק מהבסיס. מגיעה לי הלנה?"
  a: "אם המרחק 100 ק״מ בלי תחנת רכבת סמוכה, או 120 ק״מ עם תחנה, אפשר לבקש הלנה מטעמי מרחק. המרחק נמדד ב״מרחקון צה״ל״."
  rights: [housing]
- id: rent-contract
  group: "דיור והלנה"
  order: 27
  q: "איזה חוזה צריך לשכר דירה?"
  a: "חוזה שכירות תקין עם חתימות ות״ז של כל הצדדים, תקופה, תאריך חתימה, סכום וכתובת. חוזה בכתב יד מתקבל, ולא צריך חוזה מקורי."
  rights: [rent]
- id: rent-over-cap
  group: "דיור והלנה"
  order: 28
  q: "השכירות שלי יקרה מהתקרה. כמה אקבל?"
  a: "את התקרה. מי שמשלם פחות מהתקרה מקבל את מה שהוא משלם."
  rights: [rent]
- id: married-maintenance
  group: "דיור והלנה"
  order: 29
  q: "אני נשוי ומקבל שכר דירה. מגיעה לי גם אחזקת דירה?"
  a: "התשובה תלויה במקרה. בודקים את הנתונים שלכם עם מש״קית הת״ש לפני שמסתמכים עליה."
  rights: [rent, married-soldier]
- id: alach-cities
  group: "דיור והלנה"
  order: 30
  q: "איפה יש דירות אל״ח?"
  a: "חיפה, חולון, תל אביב, הרצליה, באר שבע, נתניה, פתח תקווה, גבעתיים, ירושלים, אשדוד, ראשון לציון, רמת גן, בני ברק ורחובות."
  rights: [military-housing]

- id: wedding-leave
  group: "משפחה"
  order: 31
  q: "כמה ימי חופשה מגיעים לחתונה?"
  a: "10 ימי מיוחדת, מחודש לפני החתונה ועד שלושה חודשים אחריה. בחירום, ורק אם צרכים מבצעיים מחייבים, סא״ל רשאי לאשר 5 ימים במקום 10."
  rights: [married-soldier]
- id: married-both-soldiers
  group: "משפחה"
  order: 32
  q: "שנינו בסדיר ונשואים. נקבל תשמ״ש ושכר דירה?"
  a: "כן. מי שברמת הפעילות הגבוהה יותר מקבל תשמ״ש, והשני שכ״ד בתקרה מלאה. שתי ההטבות לא יוזנו לאותו חייל."
  rights: [married-soldier]
- id: daycare-refund
  group: "משפחה"
  order: 33
  q: "יש החזר על מעון או גן לילד?"
  a: "בספר מופיע החזר של 580 ₪ לחודש לכל ילד בגיל 3 חודשים עד 5, לחיילי חובה ברמ״פ ב׳ ומעלה, רק עד 31/08/2026. בודקים מול מש״קית הת״ש אם ההטבה הוארכה."
  rights: [married-soldier]
- id: tashmash-siblings
  group: "משפחה"
  order: 34
  q: "אחי ואני בסדיר. שנינו נקבל תשמ״ש?"
  a: "לא. כששני אחים בשירות חובה רק אחד זכאי, בעדיפות לאח ברמת הפעילות הגבוהה יותר. אפשר לפנות לתא תשמ״ש להכרה כ׳אח זכאי תשמ״ש׳."
  rights: [family-payments]
- id: tashmash-sick-food-money
  group: "משפחה"
  order: 35
  q: "אני זכאי תשמ״ש ובגימלים בבית. מגיעים לי דמי כלכלה?"
  a: "כן, אם החופשה מעל 3 ימים, החל מהיום הראשון. זה לא אוטומטי: פונים לגורמי המשא״ן ביחידה."
  rights: [family-payments]
- id: atuda-car-refund
  group: "משפחה"
  order: 36
  q: "אני עתודאי ונוסע ברכב שלי. יש החזר?"
  a: "בשירות חובה, מגיל 22, ברכב שבבעלותכם: עד 250.8 ₪. מגישים לקצין המשא״ן רישיון רכב, רישיון נהיגה וטופס חתום על ידי רס״ן לפחות."
  rights: [atudaim]

- id: aka-fund-appliances
  group: "כסף ובריאות"
  order: 37
  q: "אפשר לקבל מקרר או ריהוט מהצבא?"
  a: "יש את קרן הסיוע של האגודה למען החייל: מוצרי חשמל, ריהוט ותווי קנייה, כולל הובלה, לחייל במצוקה כלכלית. פונים למש״קית הת״ש, ומביאים אישורים תוך 30 יום."
  rights: [financial-aid]
- id: vouchers-expire
  group: "כסף ובריאות"
  order: 38
  q: "תווי הקנייה שלי נמחקים?"
  a: "תווים מתמשכים טובים עד 60 יום מיום ההזנה. מה שלא נוצל עד תום התוקף נמחק, והכסף לא מוחזר."
  rights: [financial-aid]
- id: grants-over-2000
  group: "כסף ובריאות"
  order: 39
  q: "למה צריך ליווי פיננסי כדי לקבל עוד מענק?"
  a: "מי שקיבל מענקים מעל 2,000 ₪ בשנה קלנדרית חייב להצטרף לליווי פיננסי. בלי השתתפות לא יוזנו לו מענקים נוספים באותה שנה."
  rights: [financial-education, financial-aid]
- id: crown-implant
  group: "כסף ובריאות"
  order: 40
  q: "אני צריך כתר או שתל. הצבא עוזר?"
  a: "לוחמים, בודדים, זכאי סיוע וזכאי תשמ״ש יכולים לקבל הפניה דרך מרפאת השיניים ביחידה. אחרים במצוקה כלכלית מגישים בקשה דרך מש״קית הת״ש. זו הפניה לטיפול צבאי, לא החזר כסף."
  rights: [dental]
