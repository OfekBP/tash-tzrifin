# שאלות נפוצות. כל שאלה: id (באנגלית, ייחודי), group, q, a, ו-rights (קישור לעמוד המלא, אופציונלי).
# שורת התשובה בין מרכאות. אם יש בה נקודתיים, חובה מרכאות.

- id: how-know-tash
  group: זכויות ות״ש
  q: איך אני יודע אם מגיע לי הת״ש?
  a: "הזכאות נקבעת אחרי בדיקת המצב והמסמכים. הדרך המהירה לראות מה רלוונטי היא לענות על השאלון באתר, ולעבור לעמוד הזכות המתאימה."
  rights: [service-relief]
- id: tash3-vs-5
  group: זכויות ות״ש
  q: מה ההבדל בין הת״ש 3 להת״ש 5?
  a: "בהת״ש 3 החייל ישן בבית לפחות שלושה לילות בשבוע, ובהת״ש 5 לפחות חמישה."
  rights: [service-relief]
- id: how-long
  group: זכויות ות״ש
  q: כמה זמן לוקח לקבל תשובה?
  a: "משך הטיפול תלוי בסוג הבקשה. ב-ת״ש בטאצ׳ אפשר לעקוב אחרי הסטטוס, ומתקבלת התראה כשהסטטוס משתנה וכשהבקשה מגיעה ליום ה-30."
- id: missing-docs
  group: זכויות ות״ש
  q: מה קורה אם חסרים לי מסמכים?
  a: "אפשר להשלים מסמכים בהמשך, ולפעמים אפשר לבחון סיוע גם בלי כולם (למשל בשוברים ידניים). כל עמוד זכות כולל רשימת מסמכים לסימון."
  rights: [financial-aid]

- id: lone-vs-assist
  group: חיילים בודדים וזכאי סיוע
  q: מה ההבדל בין חייל בודד לזכאי סיוע?
  a: "חייל בודד הוא מי שאין לו עורף משפחתי בישראל, למשל כשהוריו בחו״ל. זכאי סיוע הוא מי שאינו מקבל מהוריו תמיכה רגשית וכלכלית מלאה. אלו שתי הכרות שונות עם הטבות שונות."
  rights: [lone-soldier, assistance-eligible]
- id: assist-without-lone
  group: חיילים בודדים וזכאי סיוע
  q: האם אפשר להיות זכאי סיוע בלי להיות חייל בודד?
  a: "כן. ההכרה מתאימה לחייל שאינו בהכרח בודד, אבל בפועל אין לו עורף משפחתי מספק."
  rights: [assistance-eligible]
- id: lone-benefits
  group: חיילים בודדים וזכאי סיוע
  q: אילו הטבות מקבלים חיילים בודדים?
  a: "מענק חודשי, תווי קנייה, פתרונות דיור, השתתפות בשכר דירה, חופשות מיוחדות וליווי לקראת השחרור."
  rights: [lone-soldier]
- id: rent-help
  group: חיילים בודדים וזכאי סיוע
  q: האם מגיע לי סיוע בשכר דירה?
  a: "לחיילים בודדים יש מסלול של השתתפות בשכר דירה, ויש גם סיוע בשכר דירה מטעמי פרט. הסכומים והתנאים שונים בין המסלולים."
  rights: [lone-soldier, housing]
- id: vouchers
  group: חיילים בודדים וזכאי סיוע
  q: איך מקבלים תווי קנייה?
  a: "חלק מהתווים מוזנים אוטומטית בחוגר לזכאים, וחלק נפתחים בבקשה."
  rights: [financial-aid]

- id: minus
  group: סיוע כלכלי
  q: אני במינוס בבנק, האם אפשר לקבל סיוע?
  a: "יש כמה מסלולים: מענק בזק, מענק, הלוואה מידית וסיוע בתווים. כל המסלולים מפורטים בעמוד הסיוע הכלכלי."
  rights: [financial-aid]
- id: grant-vs-loan
  group: סיוע כלכלי
  q: מה ההבדל בין מענק להלוואה?
  a: "מענק לא מחזירים. הלוואה מידית מוחזרת בניכוי חודשי מהתלוש."
  rights: [financial-aid]
- id: bazak
  group: סיוע כלכלי
  q: מהו מענק בזק?
  a: "מענה ראשוני ומיידי לבעיה כלכלית דחופה. לפי המידע הקיים הוא מועבר לחשבון בתוך 72 שעות."
  rights: [financial-aid]
- id: appliances
  group: סיוע כלכלי
  q: האם יש סיוע ברכישת מוצרי חשמל?
  a: "כן, קרן הסיוע של האגודה למען החייל מסייעת במוצרי חשמל, ריהוט ומוצרי יסוד לחיילים במצוקה."
  rights: [financial-aid]

- id: may-work
  group: עבודה
  q: האם מותר לי לעבוד בזמן השירות?
  a: "רק עם היתר עבודה מתאים."
  rights: [private-work-permit]
- id: get-permit
  group: עבודה
  q: איך מוציאים היתר עבודה?
  a: "מכינים את המסמכים לפי סוג ההיתר, מגישים דרך מש״קית הת״ש ומחתימים מפקדים. הרשימה המלאה בעמוד היתר העבודה."
  rights: [private-work-permit]
- id: lone-docs
  group: עבודה
  q: האם חייל בודד צריך להציג מסמכים כלכליים להיתר עבודה?
  a: "חיילים בודדים עשויים להיות פטורים מהמצאת אישורים כלכליים, אבל עדיין צריך לקבל היתר."
  rights: [private-work-permit]
- id: work-before-permit
  group: עבודה
  q: האם אפשר לעבוד לפני קבלת היתר?
  a: "לא. אין להתחיל לעבוד לפני שהתקבל היתר."
  rights: [private-work-permit]
- id: permit-vs-leave
  group: עבודה
  q: מה ההבדל בין היתר עבודה לחופשה מיוחדת כלכלית?
  a: "היתר מאפשר לעבוד מחוץ לשעות השירות. חופשה מיוחדת כלכלית משחררת אותך לימים מסוימים כדי לעבוד."
  rights: [private-work-permit, special-leave]

- id: leave-days-eco
  group: חופשות
  q: כמה ימים אפשר לקבל בחופשה מיוחדת כלכלית?
  a: "עד 40 ימים בשנת שירות, לפי המידע הקיים."
  rights: [special-leave]
- id: leave-deduct
  group: חופשות
  q: האם חופשה מיוחדת יורדת מהחופשה השנתית?
  a: "חופשה מיוחדת כלכלית ואישית יורדת ממכסת החופשה המיוחדת של שנת השירות."
  rights: [special-leave]
- id: psycho
  group: חופשות
  q: האם מגיעים לי ימי חופשה לצורך פסיכומטרי?
  a: "כן, חופשת לימודים: 4 ימים לכל בחינה, עד שתי בחינות בשנת שירות, אם אינך בהכשרה ראשונית."
  rights: [special-leave]
- id: wedding
  group: חופשות
  q: כמה ימים מגיעים לי לחתונה?
  a: "10 ימי חופשה מיוחדת, לפני החתונה ועד שלושה חודשים אחריה."
  rights: [married-soldier, special-leave]
- id: move-leave
  group: חופשות
  q: האם מגיעה חופשה לצורך מעבר דירה?
  a: "יומיים לכל מעבר דירה, לחיילים בודדים ונשואים."
  rights: [special-leave]

- id: what-balance
  group: מסמכים ובנקים
  q: מה זה ריכוז יתרות?
  a: "מסמך שמציג את התמונה הכוללת של החשבון: יתרות בעו״ש, חסכונות, הלוואות ופיקדונות, ליום מסוים."
  rights: []
- id: how-statement
  group: מסמכים ובנקים
  q: איך מוציאים תדפיס עו״ש?
  a: "בחרו את הבנק שלכם באזור המדריכים, וצפו בהדרכה או בשלבים הכתובים."
- id: screenshot
  group: מסמכים ובנקים
  q: האם אפשר להגיש צילום מסך מהאפליקציה?
  a: "ברוב המקרים נדרש מסמך מלא ולא צילום מסך. בכמה בנקים ההנחיה היא לצלם את המסך, וזה מופיע במדריך של הבנק שלכם."
- id: parents-docs
  group: מסמכים ובנקים
  q: האם צריך להגיש מסמכים גם של ההורים?
  a: "בחלק מהמסלולים כן (למשל תשמ״ש, והיתר עבודה מטעמי מצוקה). הרשימה מופיעה בעמוד של כל זכות."
  rights: [family-payments, private-work-permit]
