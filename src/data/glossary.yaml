# מילון מושגים. כל מושג: id, term, meaning, aliases (כינויים לחיפוש, אופציונלי).

- id: hatash
  term: הת״ש
  meaning: "הקלות בתנאי שירות: אפשרות לישון בבית מספר לילות בשבוע כשהמצב המשפחתי, הרפואי, הכלכלי או הסוציאלי מחייב זאת."
  aliases: [הקלות בתנאי שירות]
- id: assistance
  term: זכאי סיוע
  meaning: "חייל שאינו מתגורר בבית הוריו או אינו מקבל מהם תמיכה רגשית וכלכלית מלאה. זו הכרה נפרדת מחייל בודד."
- id: lone
  term: חייל בודד
  meaning: "חייל שהוכר ככזה לפי תנאי הזכאות הצבאיים, למשל כשאין לו עורף משפחתי בישראל."
- id: tashmash
  term: תשמ״ש
  meaning: "תשלומי משפחה: תשלום חודשי קבוע לקיום מינימלי של ההורים או בת הזוג של החייל."
  aliases: [תשלומי משפחה]
- id: halana
  term: הלנה
  meaning: "פתרון מגורים לחייל: מטעמי פרט, מרחק או צפיפות."
- id: meals
  term: דמי כלכלה
  meaning: "החזר או תשלום עבור מזון כשהחייל אינו מקבל ארוחות במסגרת הצבאית."
- id: special-leave
  term: חופשה מיוחדת
  meaning: "ימי חופשה לצורך אישי, כלכלי, משפחתי או לימודי, מעבר לחופשה הרגילה."
- id: work-permit
  term: היתר עבודה
  meaning: "אישור לעבוד מחוץ לשעות השירות. אסור לעבוד בלעדיו."
- id: voucher
  term: תו קנייה
  meaning: "הטבה לרכישת מזון ומוצרים בסיסיים. אסור לרכוש בה אלכוהול וסיגריות."
- id: bazak
  term: מענק בזק
  meaning: "מענה ראשוני ומיידי לבעיה כלכלית דחופה."
- id: balance
  term: ריכוז יתרות
  meaning: "מסמך מהבנק עם תמונה כוללת של היתרות בחשבון, בחסכונות, בהלוואות ובפיקדונות ליום מסוים."
  aliases: [אישור יתרות]
- id: osh
  term: עו״ש
  meaning: "עובר ושב: החשבון השוטף. תדפיס עו״ש מציג את התנועות בו."
  aliases: [עובר ושב, תדפיס]
- id: activity-level
  term: רמת פעילות
  meaning: "הסיווג של תנאי השירות (א׳, ב׳, ג׳ ועוד) שמשפיע על חלק מהסכומים והזכויות."
